name: Theme and Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare local sample environment
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check PHP syntax
        run: find wp-content/themes/bamero wp-content/plugins/bamero-core -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate theme.json syntax
        run: node -e "JSON.parse(require('fs').readFileSync('wp-content/themes/bamero/theme.json', 'utf8'))"

      - name: Check navigation JavaScript syntax
        run: node --check wp-content/themes/bamero/assets/js/navigation.js

      - name: Run identity unit tests
        run: php tests/identity-phone-number.test.php

      - name: Run MeliPayamak provider contract tests
        run: php tests/melipayamak-provider.test.php

      - name: Run theme accessibility and metadata regression tests
        run: node tests/navigation-a11y.test.cjs

      - name: Verify bundled Vazirmatn font and license
        run: |
          test "$(sha256sum 'wp-content/themes/bamero/assets/fonts/Vazirmatn[wght].woff2' | cut -d ' ' -f 1)" = '4e3fa217d38fdafc1fea4414ceb58ca5e662cf0ab5fa735a8c8c20e8b42cad92'
          grep -F 'SIL OPEN FONT LICENSE Version 1.1' wp-content/themes/bamero/assets/fonts/OFL.txt
