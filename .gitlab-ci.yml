stages:
  - validate
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

php_syntax:
  stage: validate
  image: php:8.5-cli
  script:
    - find wp-content/themes/bamero -type f -name '*.php' -print0 | xargs -0 -n1 php -l

json_validation:
  stage: validate
  image: node:24-alpine
  script:
    - node -e "JSON.parse(require('fs').readFileSync('wp-content/themes/bamero/theme.json', 'utf8'))"

javascript_syntax:
  stage: validate
  image: node:24-alpine
  script:
    - node --check wp-content/themes/bamero/assets/js/navigation.js

theme_contract_tests:
  stage: test
  image: node:24-alpine
  script:
    - node tests/navigation-a11y.test.cjs
