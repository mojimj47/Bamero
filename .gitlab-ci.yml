stages:
  - validate
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

php_syntax:
  stage: validate
  image: php:8.5-cli
  script:
    - find wp-content/themes/bamero wp-content/plugins/bamero-core -type f -name '*.php' -print0 | xargs -0 -n1 php -l

json_validation:
  stage: validate
  image: node:24-alpine
  script:
    - node -e "JSON.parse(require('fs').readFileSync('wp-content/themes/bamero/theme.json', 'utf8'))"

javascript_syntax:
  stage: validate
  image: node:24-alpine
  script:
    - node --check wp-content/themes/bamero/assets/js/navigation.js

identity_unit_tests:
  stage: test
  image: php:8.5-cli
  script:
    - php tests/identity-phone-number.test.php

identity_hmac_hashing_tests:
  stage: test
  image: php:8.5-cli
  script:
    - php tests/identity-hmac-hasher.test.php

otp_security_primitives_tests:
  stage: test
  image: php:8.5-cli
  script:
    - php tests/otp-security-primitives.test.php

melipayamak_provider_tests:
  stage: test
  image: php:8.5-cli
  script:
    - php tests/melipayamak-provider.test.php

catalog_manifest_tests:
  stage: test
  image: php:8.5-cli
  script:
    - php tests/catalog-manifest.test.php

demo_data_contract_tests:
  stage: test
  image: php:8.5-cli
  script:
    - php tests/demo-data-contract.test.php

database_integration_tests:
  stage: test
  image: php:8.5-cli
  services:
    - name: mariadb:11.8.9
      alias: db
  variables:
    MARIADB_DATABASE: bamero_test
    MARIADB_USER: bamero
    MARIADB_PASSWORD: bamero_test_password
    MARIADB_ROOT_PASSWORD: root_test_password
    DB_HOST: db
    DB_PORT: '3306'
    DB_NAME: bamero_test
    DB_USER: bamero
    DB_PASSWORD: bamero_test_password
  before_script:
    - docker-php-ext-install pdo_mysql
    - until php -r '$p=@new PDO("mysql:host=db;dbname=bamero_test", "bamero", "bamero_test_password");' 2>/dev/null; do sleep 2; done
  script:
    - php tests/database-schema.integration.php
    - php tests/otp-challenge-store.integration.php

theme_contract_tests:
  stage: test
  image: node:24-alpine
  script:
    - node tests/navigation-a11y.test.cjs
